# Merge into ~/.hermes/config.yaml (host or reach-lab). Required part:
mcp_servers:
  reach:
    url: http://127.0.0.1:4200/mcp      # tools register as mcp__reach__<tool>
plugins:
  enabled: [reach-agent-computer]       # standalone user plugins are opt-in
  entries:
    reach-agent-computer:
      settings:
        api_url: http://127.0.0.1:4200  # reach REST (lease/takeover); no env vars needed
        allow_exec: false             # new leases only; also requires reach create --allow-exec
# Install: ln -s <agent-computer>/integrations/hermes/plugins/reach-agent-computer ~/.hermes/plugins/
#          ln -s <agent-computer>/integrations/hermes/skills/agent-computer      ~/.hermes/skills/
# Everything below is reach-lab (Linux VM) specific; skip on a macOS host.
gateway:
  # Linux/systemd-only: makes `hermes gateway` send sd_notify heartbeats and
  # lets the hermes-gateway.service unit run Type=notify with a matching
  # WatchdogSec, so systemd restarts the process if its event loop stalls.
  systemd_watchdog_seconds: 120
# One browser only: the Agent Computer. Drop hermes's own browser ("browser") +
# host desktop control ("computer_use") toolsets by omitting them here.
# reach's MCP tools need no toolset entry: mcp_servers below enables them directly.
platform_toolsets:
  cli: [web, terminal, file, skills, todo, cronjob, memory, vision, delegation]
terminal:
  backend: local
  cwd: /srv/reach/workspaces/agent-computer
