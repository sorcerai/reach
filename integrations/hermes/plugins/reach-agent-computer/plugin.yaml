name: reach-agent-computer
version: "0.2.0"
description: "Lease one reach Agent Computer screen per Hermes profile, route reach MCP tools to it, provide reach_drive (CUA via agy), and record human takeovers."
author: "Reach Team"
kind: standalone
provides_tools: [reach_lease_screen, reach_release_screen, reach_status, reach_drive]
provides_hooks: [on_session_start, pre_llm_call, pre_tool_call, post_tool_call, on_session_finalize]
config_schema:
  api_url:
    type: str
    default: "http://127.0.0.1:4200"
    description: "reach host daemon base URL (REST + /mcp)"
  repo_root:
    type: str
    description: "agent-computer checkout containing scripts/reach_drive.py (default: derived from plugin path)"
