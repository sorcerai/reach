name: buzz-groupchat
version: "0.1.0"
description: "Multi-Bot Groupchat surface: integrate with self-hosted Buzz (ariaserver:3000) for persistent history, @mentions, visual diff audit reels, and human takeover cards."
author: "Reach Team"
kind: standalone
provides_tools: [buzz_send_message, buzz_send_takeover_alert, buzz_post_visual_diff, buzz_get_messages, buzz_list_channels]
config_schema:
  relay_url:
    type: str
    default: "http://100.124.38.17:3000"
    description: "Buzz relay URL"
  channel:
    type: str
    default: "general"
    description: "Default Buzz channel name or ID"

tools:

  - name: buzz_send_message
    description: "Send a message or status update to a Buzz channel or thread."
    parameters:
      type: object
      required:
        - channel
        - content
      properties:
        channel:
          type: string
          description: "Target channel ID or name."
        content:
          type: string
          description: "Message content (supports markdown and @mentions)."
        reply_to:
          type: string
          description: "Optional parent message ID to reply in a thread."
        broadcast:
          type: boolean
          default: false
          description: "Whether to also broadcast thread reply to the channel."

  - name: buzz_send_takeover_alert
    description: "Post an interactive Human Takeover alert to a Buzz channel or thread when 2FA, Captcha, or credentials require human intervention."
    parameters:
      type: object
      required:
        - channel
        - screen
      properties:
        channel:
          type: string
          description: "Target Buzz channel ID or name."
        screen:
          type: integer
          description: "Screen ID where human intervention is required."
        reply_to:
          type: string
          description: "Optional thread ID to post the takeover request under."

  - name: buzz_post_visual_diff
    description: "Post numeric visual-change metadata without screenshots or model text."
    parameters:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          description: "Target Buzz channel ID or name."
        diff_percent:
          type: number
          description: "Optional perceptual hash or visual difference percentage (0.0 to 100.0)."
        tokens_saved:
          type: integer
          description: "Optional estimated tokens saved; not a provider measurement."
        reply_to:
          type: string
          description: "Optional thread ID to post under."

  - name: buzz_get_messages
    description: "Read recent messages from a Buzz channel or thread to check for @mentions or user instructions."
    parameters:
      type: object
      required:
        - channel
      properties:
        channel:
          type: string
          description: "Channel ID or name."
        limit:
          type: integer
          default: 20
          description: "Maximum number of messages to retrieve."

  - name: buzz_list_channels
    description: "List available channels on the Buzz relay."
    parameters:
      type: object
      properties:
        relay_url:
          type: string
          description: "Optional Buzz relay URL override."
