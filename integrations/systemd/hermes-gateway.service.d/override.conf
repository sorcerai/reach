# Drop-in, not edits to hermes-gateway.service itself: hermes's own
# `hermes gateway` entrypoint calls refresh_systemd_unit_if_needed() on every
# startup (hermes_cli/gateway.py, run_gateway()) and rewrites the base unit
# file back to its own generated shape whenever it differs — silently
# discarding any hand edits to Description=, After=, or TimeoutStartSec=.
# A systemd drop-in under <unit>.d/ is a separate file hermes never touches
# (it only ever writes the single hermes-gateway.service path), so this is
# the durable way to layer our ordering + start-timeout on top of whatever
# hermes regenerates.
[Unit]
After=reach-serve.service

[Service]
# Type=notify's default start timeout is short; hermes can take a while to
# load its provider clients and send READY=1, so give it more room.
TimeoutStartSec=180
