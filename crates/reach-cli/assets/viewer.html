<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reach screen</title><style>html,body,#screen{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:16px system-ui}#status{position:absolute;z-index:2;padding:.5rem;background:#111}</style></head><body><div id="status" role="status">Connecting</div><div id="screen"></div><script type="module">
import RFB from './novnc.js';
const status=document.getElementById('status');
const endpoint=new URL(location.href);endpoint.protocol=location.protocol==='https:'?'wss:':'ws:';endpoint.pathname=endpoint.pathname.replace(/\/vnc\.html$/,'/session');endpoint.search='';endpoint.hash='';
const rfb=new RFB(document.getElementById('screen'),endpoint.href,{shared:true});
rfb.scaleViewport=true;rfb.resizeSession=false;rfb.viewOnly=new URLSearchParams(location.search).get('mode')!=='control';
rfb.addEventListener('connect',()=>{status.hidden=true});
rfb.addEventListener('disconnect',()=>{status.hidden=false;status.textContent='Disconnected. Reopen the authenticated viewer to reconnect.'});
rfb.addEventListener('securityfailure',()=>{status.hidden=false;status.textContent='Display authentication failed'});
rfb.addEventListener('credentialsrequired',()=>{const password=prompt('Configured VNC password');if(password!==null)rfb.sendCredentials({password});else rfb.disconnect()});
</script></body></html>
